name: Сборка Portable версий (Linux AppImage & Windows Portable)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-appimage:
    name: Сборка AppImage (Astra Linux / Ubuntu)
    runs-on: ubuntu-22.04

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Установка системных библиотек для Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 libfuse2 icnsutils graphicsmagick

      - name: Установка npm-зависимостей
        run: npm install

      - name: Сборка веб-интерфейса Vite
        run: npm run build

      - name: Сборка Electron Main & Preload
        run: npm run build:electron

      - name: Подготовка native-модулей
        run: |
          npx @electron/rebuild -f -w better-sqlite3 || true
          node electron/patch-glibc.cjs

      - name: Сборка Linux пакетов (AppImage и DEB для Astra Linux)
        run: |
          npx electron-builder --linux AppImage deb --x64 -p never
          node electron/patch-appimage.cjs
          chmod +x release/*.AppImage

      - name: Загрузка AppImage для Linux в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-Linux-AppImage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Загрузка DEB пакета для Astra Linux в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-Linux-DEB
          path: release/*.deb
          if-no-files-found: ignore
          retention-days: 30

      - name: Добавление дистрибутивов Linux в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.AppImage
            release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-portable:
    name: Сборка Portable EXE (Windows)
    runs-on: windows-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Установка npm-зависимостей
        run: npm install

      - name: Сборка веб-интерфейса Vite
        run: npm run build

      - name: Сборка Electron Main & Preload
        run: npm run build:electron

      - name: Сборка Windows Portable EXE
        run: npx electron-builder --win portable --x64 -p never

      - name: Загрузка Windows Portable в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Добавление Windows Portable в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
